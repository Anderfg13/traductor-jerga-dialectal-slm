# TIES-merging (merge_method: ties) de los tres modelos completos respecto al modelo
# base: recorta cada "vector de tarea" (modelo - base) a su fracción más grande
# (density), resuelve conflictos de signo y promedia. density 0.5 y pesos 1 son los
# mismos valores usados con PEFT (merging/fusionar_adaptadores.py), para comparar.
models:
  - model: merging/modelos_completos/generador1
    parameters:
      density: 0.5
      weight: 1.0
  - model: merging/modelos_completos/generador2
    parameters:
      density: 0.5
      weight: 1.0
  - model: merging/modelos_completos/generador3
    parameters:
      density: 0.5
      weight: 1.0
merge_method: ties
base_model: Qwen/Qwen2.5-3B-Instruct
parameters:
  normalize: true
dtype: float16
